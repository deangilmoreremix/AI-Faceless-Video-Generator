<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <nav>
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </nav>
        <h1>Your Videos</h1>
        <div class="video-grid">
            {% for video in videos %}
                <div class="video-card">
                    <video width="320" height="240" controls>
                        <source src="{{ url_for('uploaded_file', filename=video.video_path.split('/')[-1]) }}" type="video/mp4">
                    </video>
                    <a href="{{ url_for('uploaded_file', filename=video.video_path.split('/')[-1]) }}" download>Download</a>
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
